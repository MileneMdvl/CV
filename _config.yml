title: Milène Mandeville &ndash; Academic CV

# Source - https://stackoverflow.com/a/79750788
# Posted by Michael Oladoye
# Retrieved 2026-10-27, License - CC BY-SA 4.0

---
name: Build LaTeX PDF

on: [push]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Generate PDF document
        uses: hspaans/latexmk-action@v2.1.0
        with:
          format: pdf
          filename: Milene%20Mandeville%20CV%20(ENG).tex
          options: -shell-escape
      - name: Upload PDF to repo
        run: |
          mv main.pdf public/resume.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CV/resumes/Milene%20Mandeville%20CV%20(ENG).pdf
          git commit -m "Update compiled PDF" || echo "No changes to commit"
          git push


